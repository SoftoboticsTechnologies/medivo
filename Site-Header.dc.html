<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</helmet>
<header style="position:sticky;top:0;z-index:60;background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);borderBottom:1px solid #E2E7EC;fontFamily:'Plus Jakarta Sans',system-ui,sans-serif">
  <div style="maxWidth:1280px;margin:0 auto;padding:10px clamp(16px,3vw,40px);minHeight:74px;display:grid;gridTemplateColumns:1fr auto 1fr;alignItems:center;gap:clamp(16px,2vw,32px)">
    <a href="index.html" aria-label="Medivo Healthcare home" style="grid-column:1;justify-self:start;display:flex;alignItems:center;textDecoration:none;flexShrink:0;minWidth:0">
      <img src="assets/Medivo%20logo/full%20logo.png" alt="Medivo Healthcare" style="height:clamp(38px,7vw,56px);width:auto;maxWidth:100%;display:block" />
    </a>

    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Primary" style="grid-column:2;justify-self:center;display:flex;alignItems:center;flexWrap:wrap;justifyContent:center;gap:clamp(8px,1.4vw,22px)">
        <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="8">
          <div style="position:relative;display:flex;flexDirection:column;alignItems:center;paddingTop:4px">
            <a href="{{ item.href }}" style="fontSize:13.5px;fontWeight:600;letterSpacing:0.01em;color:#2A3B49;textDecoration:none;whiteSpace:nowrap;padding:4px 0" style-hover="color:#0B266B">{{ item.label }}</a>
            <span style="height:2px;width:100%;marginTop:6px;background:transparent">
              <sc-if value="{{ item.isActive }}" hint-placeholder-val="{{ false }}">
                <span style="display:block;height:2px;width:100%;background:#0B266B"></span>
              </sc-if>
            </span>
          </div>
        </sc-for>
      </nav>
      <a href="Contact.dc.html" style="grid-column:3;justify-self:end;background:#00A87E;color:#fff;fontSize:13.5px;fontWeight:600;padding:11px 18px;textDecoration:none;whiteSpace:nowrap;border:1px solid #00A87E" style-hover="background:#fff;color:#00A87E;borderColor:#00A87E">Request a Quote</a>
    </sc-if>

    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <div style="grid-column:3;justify-self:end;display:flex;alignItems:center;gap:10px">
        <a href="tel:+918800261800" aria-label="Call Medivo Healthcare" style="display:flex;alignItems:center;justifyContent:center;width:44px;height:44px;color:#00A87E;border:1px solid #D6DEE5">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.36 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.34 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"></path></svg>
        </a>
        <button type="button" onClick="{{ toggleMenu }}" aria-label="Open navigation menu" aria-expanded="{{ menuOpen }}" style="width:44px;height:44px;border:1px solid #D6DEE5;background:#fff;display:flex;flexDirection:column;alignItems:center;justifyContent:center;gap:5px;cursor:pointer">
          <span style="display:block;width:18px;height:1.5px;background:#00A87E"></span>
          <span style="display:block;width:18px;height:1.5px;background:#00A87E"></span>
          <span style="display:block;width:18px;height:1.5px;background:#00A87E"></span>
        </button>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="borderTop:1px solid #E2E7EC;background:#fff;maxHeight:70vh;overflowY:auto">
      <nav aria-label="Mobile" style="display:flex;flexDirection:column;padding:8px 0">
        <sc-for list="{{ allLinks }}" as="item" hint-placeholder-count="13">
          <a href="{{ item.href }}" style="padding:15px clamp(16px,3vw,40px);fontSize:15px;fontWeight:600;color:#0B266B;textDecoration:none;borderBottom:1px solid #EEF1F4">{{ item.label }}</a>
        </sc-for>
        <a href="Contact.dc.html" style="margin:14px clamp(16px,3vw,40px) 20px;background:#00A87E;color:#fff;fontSize:15px;fontWeight:700;padding:16px;textAlign:center;textDecoration:none">Request a Quote</a>
      </nav>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1400, menuOpen: false };
  componentDidMount() {
    this._r = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this._r);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const active = this.props.active || '';
    const nav = [
      ['Home', 'index.html'], ['About', 'About.dc.html'], ['Services', 'Services.dc.html'],
      ['Industries', 'Industries.dc.html'], ['Our Process', 'Process.dc.html'],
      ['Safety & Quality', 'Safety-Quality.dc.html'], ['FAQ', 'FAQ.dc.html'], ['Contact', 'Contact.dc.html']
    ];
    const serviceLinks = [
      { num: '01', label: 'RF Cage Installation & Repair', note: 'MRI room RF shielding, repair and maintenance.', href: 'RF-Cage.dc.html' },
      { num: '02', label: 'Quench Pipe Solutions', note: 'Helium vent routing, inspection and repair.', href: 'Quench-Pipe.dc.html' },
      { num: '03', label: 'Mechanical Installation & Dismantling', note: 'Positioning, installation, relocation.', href: 'Mechanical-Installation.dc.html' },
      { num: '04', label: 'Unloading Services', note: 'Controlled unloading of imaging systems.', href: 'Unloading.dc.html' },
      { num: '05', label: 'Passive Shielding Solutions', note: 'Facility-specific passive shielding.', href: 'Passive-Shielding.dc.html' }
    ];
    return {
      isDesktop: this.state.w >= 1120,
      isMobile: this.state.w < 1120,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      navItems: nav.map(([label, href]) => ({
        label, href, isActive: active === label
      })),
      allLinks: nav.slice(0, 3).concat(serviceLinks.map(s => [s.label, s.href]), nav.slice(3))
        .map(x => Array.isArray(x) ? { label: x[0], href: x[1] } : x)
    };
  }
}
</script>
</body>
</html>
